name: Production CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Choose deployment type'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - expo
          - native-android
          - native-ios
          - native-all
      version_code:
        description: 'Android VersionCode (e.g. 8)'
        required: false
        default: ''
      version_name:
        description: 'Android VersionName (e.g. 1.0.7)'
        required: false
        default: ''
      ios_version:
        description: 'iOS Marketing Version (e.g. 1.2.0) - leave empty for no change'
        required: false
        default: ''
      ios_build_number:
        description: 'iOS Build Number (e.g. 45) - leave empty for auto-increment'
        required: false
        default: ''

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      deps: ${{ steps.filter.outputs.deps }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before || github.sha }}
          ref: ${{ github.sha }}
          filters: |
            native:
              - 'android/**'
              - 'ios/**'
            deps:
              - 'package.json'
              - 'package-lock.json'
              - 'yarn.lock'
              - 'pnpm-lock.yaml'
              - 'app.json'
              - 'babel.config.js'
              - 'metro.config.js'
              - 'tsconfig.json'
            js:
              - 'src/**'
              - 'assets/**'
              - 'index.js'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'

      - name: Debug detected changes
        run: |
          echo "Deploy type: ${{ github.event.inputs.deploy_type }}"
          echo "Native changes: ${{ steps.filter.outputs.native }}"
          echo "Deps changes: ${{ steps.filter.outputs.deps }}"
          echo "JS changes: ${{ steps.filter.outputs.js }}"

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: yarn install || npm install

      - name: Verify setup
        run: |
          echo "✅ Setup complete"
          node --version

      - name: Send Slack notification
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            STATUS="${{ job.status == 'success' && '✅' || '🚨' }}"
            curl -H "Content-Type: application/json" -X POST \
              -d "{\"text\":\"${STATUS} Production lint-and-test: ${{ job.status }}\"}" \
              ${{ secrets.SLACK_WEBHOOK }} || true
          fi

  # ==================== EXPO OTA UPDATE ====================
  expo-update:
    runs-on: ubuntu-latest
    needs: [lint-and-test, changes]
    if: >
      github.event.inputs.deploy_type == 'expo' ||
      (
        github.event.inputs.deploy_type == 'auto' &&
        needs.changes.outputs.native != 'true' &&
        needs.changes.outputs.deps != 'true' &&
        needs.changes.outputs.js == 'true'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --frozen-lockfile || npm install --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish Expo update
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          CHANNEL="production"
          MESSAGE="Production OTA: ${GITHUB_SHA::7}"
          npx eas-cli@latest update --non-interactive --channel "$CHANNEL" --message "$MESSAGE"

      - name: Send Slack notification
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            STATUS="${{ job.status == 'success' && '✅' || '🚨' }}"
            curl -H "Content-Type: application/json" -X POST \
              -d "{\"text\":\"${STATUS} Production Expo OTA Update: ${{ job.status }}\"}" \
              ${{ secrets.SLACK_WEBHOOK }} || true
          fi

  # ==================== ANDROID NATIVE BUILD ====================
  deploy-android:
    runs-on: ubuntu-latest
    needs: [lint-and-test, changes]
    if: >
      github.event.inputs.deploy_type == 'native-android' ||
      github.event.inputs.deploy_type == 'native-all' ||
      (
        github.event.inputs.deploy_type == 'auto' &&
        (needs.changes.outputs.native == 'true' || needs.changes.outputs.deps == 'true')
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --frozen-lockfile || npm install --legacy-peer-deps

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          echo "✅ Keystore restored"

      - name: Update version
        env:
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          cd android
          CURRENT_CODE=$(awk '/versionCode/ {print $2}' app/build.gradle | head -1)
          CURRENT_NAME=$(awk -F'"' '/versionName/ {print $2}' app/build.gradle | head -1)
          
          NEW_CODE="${INPUT_VERSION_CODE:-$((CURRENT_CODE + 1))}"
          if [ -n "$INPUT_VERSION_NAME" ]; then
            NEW_NAME="$INPUT_VERSION_NAME"
          else
            IFS='.' read -ra V <<< "$CURRENT_NAME"
            NEW_NAME="${V[0]:-1}.${V[1]:-0}.$((${V[2]:-0} + 1))"
          fi
          
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" app/build.gradle
          sed -i "s/versionName \"$CURRENT_NAME\"/versionName \"$NEW_NAME\"/" app/build.gradle
          echo "✅ Version: $NEW_CODE ($NEW_NAME)"

      - name: Build Android AAB
        run: |
          cd android
          ./gradlew bundleRelease \
            -PMYAPP_RELEASE_STORE_FILE=keystore.jks \
            -PMYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTORE_KEY_ALIAS }} \
            -PMYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_STORE_PASSWORD }} \
            -PMYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      - name: Deploy to Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > android/playstore-credentials.json
          cd android && fastlane playstore
          rm -f playstore-credentials.json

      - name: Send Slack notification
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            STATUS="${{ job.status == 'success' && '✅' || '🚨' }}"
            curl -H "Content-Type: application/json" -X POST \
              -d "{\"text\":\"${STATUS} Production Android deployed to Play Store: ${{ job.status }}\"}" \
              ${{ secrets.SLACK_WEBHOOK }} || true
          fi

  # ==================== iOS NATIVE BUILD ====================
  deploy-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [lint-and-test, changes]
    if: >
      github.event.inputs.deploy_type == 'native-ios' ||
      github.event.inputs.deploy_type == 'native-all' ||
      (
        github.event.inputs.deploy_type == 'auto' &&
        (needs.changes.outputs.native == 'true' || needs.changes.outputs.deps == 'true')
      )

    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install || npm install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane and CocoaPods
        run: |
          gem install fastlane cocoapods --no-document
          cd ios && pod install --repo-update

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Update iOS Version (if specified)
        if: ${{ github.event.inputs.ios_version != '' }}
        working-directory: ios
        run: |
          agvtool new-marketing-version ${{ github.event.inputs.ios_version }}
          echo "✅ iOS Version set to ${{ github.event.inputs.ios_version }}"

      - name: Set iOS Build Number (if specified)
        if: ${{ github.event.inputs.ios_build_number != '' }}
        working-directory: ios
        run: |
          agvtool new-version -all ${{ github.event.inputs.ios_build_number }}
          echo "✅ iOS Build Number set to ${{ github.event.inputs.ios_build_number }}"

      - name: Build and Deploy to TestFlight
        working-directory: ios
        run: fastlane staging

      - name: Send Slack notification
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            STATUS="${{ job.status == 'success' && '✅' || '🚨' }}"
            curl -H "Content-Type: application/json" -X POST \
              -d "{\"text\":\"${STATUS} Production iOS deployed to App Store: ${{ job.status }}\"}" \
              ${{ secrets.SLACK_WEBHOOK }} || true
          fi
