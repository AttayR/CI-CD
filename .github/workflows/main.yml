name: CI and CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'    

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js dependencies
        run: |
          echo "Installing dependencies..."
          npm install --legacy-peer-deps
          echo "✅ Dependencies installed successfully"

      - name: Verify setup
        run: |
          echo "✅ Setup verification complete"
          node --version
          npm --version
          echo "✅ All checks passed"

      - name: Send Discord notification on failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"content": "🚨 CI/CD Build Failed! Setup verification failed!"}' \
                 ${{ secrets.DISCORD_WEBHOOK_URL }} || true
          fi

      - name: Send Discord notification on success
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"content": "✅ Setup verification passed"}' \
                 ${{ secrets.DISCORD_WEBHOOK_URL }} || true
          fi
     
  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Install Fastlane
        run: sudo gem install fastlane -NV 

      - name: Deploy to Google Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > android/fastlane/playstore-credentials.json
          cd android
          fastlane playstore

      - name: Send Discord notification on failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"content": "🚨 Deployment Failed! Error logs:Fast Lane Service Failed"}' \
                 ${{ secrets.DISCORD_WEBHOOK_URL }} || true
          fi

      - name: Send Discord notification on success
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"content": "✅ Deployed To Play Store 🎉!"}' \
                 ${{ secrets.DISCORD_WEBHOOK_URL }} || true
          fi


            
