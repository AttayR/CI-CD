name: CI and CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - staging

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      deps: ${{ steps.filter.outputs.deps }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          filters: |
            native:
              - 'android/**'
              - 'ios/**'
            deps:
              - 'package.json'
              - 'package-lock.json'
              - 'yarn.lock'
              - 'pnpm-lock.yaml'
              - 'app.json'
              - 'babel.config.js'
              - 'metro.config.js'
              - 'tsconfig.json'
            js:
              - 'src/**'
              - 'assets/**'
              - 'index.js'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'

      - name: Debug detected changes
        run: |
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "before=${{ github.event.before }}"
          echo ""
          echo "paths-filter outputs:"
          echo "  native=${{ steps.filter.outputs.native }}"
          echo "  deps=${{ steps.filter.outputs.deps }}"
          echo "  js=${{ steps.filter.outputs.js }}"
          echo ""
          echo "Changed files (best-effort):"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "${GITHUB_SHA}" || true
          else
            git diff --name-only HEAD~1 HEAD || true
          fi

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'    

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js dependencies
        run: |
          echo "Installing dependencies..."
          npm install --legacy-peer-deps
          echo "✅ Dependencies installed successfully"

      - name: Verify setup
        run: |
          echo "✅ Setup verification complete"
          node --version
          npm --version
          echo "✅ All checks passed"

      - name: Send Discord notification on failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"content": "🚨 CI/CD Build Failed! Setup verification failed!"}' \
                 ${{ secrets.DISCORD_WEBHOOK_URL }} || true
          fi

      - name: Send Slack notification on failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"text": "🚨 CI/CD Build Failed! Setup verification failed!"}' \
                 ${{ secrets.SLACK_WEBHOOK }} || true
          fi

      - name: Send Discord notification on success
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"content": "✅ Setup verification passed"}' \
                 ${{ secrets.DISCORD_WEBHOOK_URL }} || true
          fi

      - name: Send Slack notification on success
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"text": "✅ Setup verification passed"}' \
                 ${{ secrets.SLACK_WEBHOOK }} || true
          fi
     
  deploy-native-android:
    runs-on: ubuntu-latest
    needs: [lint-and-test, changes]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.native == 'true' || needs.changes.outputs.deps == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode and restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "✅ Keystore restored successfully"
          else
            echo "⚠️ Warning: KEYSTORE_BASE64 secret not set"
            exit 1
          fi

      - name: Increment version code
        run: |
          cd android
          # Get current version code from build.gradle using awk (more compatible)
          CURRENT_VERSION=$(awk '/versionCode/ {print $2}' app/build.gradle | head -1)
          NEW_VERSION=$((CURRENT_VERSION + 1))
          echo "📦 Current version code in build.gradle: $CURRENT_VERSION"
          echo "📦 New version code will be: $NEW_VERSION"
          echo "⚠️  Note: If this version already exists in Play Store, the build will fail."
          echo "⚠️  In that case, manually update versionCode in build.gradle to a higher number."
          
          # Update version code in build.gradle
          sed -i "s/versionCode $CURRENT_VERSION/versionCode $NEW_VERSION/" app/build.gradle
          
          # Get current version name
          CURRENT_VERSION_NAME=$(awk -F'"' '/versionName/ {print $2}' app/build.gradle | head -1)
          echo "📦 Current version name: $CURRENT_VERSION_NAME"
          # Extract version parts (e.g., 1.0.1 -> 1.0.2)
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION_NAME"
          MAJOR=${VERSION_PARTS[0]:-1}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION_NAME="$MAJOR.$MINOR.$NEW_PATCH"
          echo "📦 New version name: $NEW_VERSION_NAME"
          # Update version name in build.gradle
          sed -i "s/versionName \"$CURRENT_VERSION_NAME\"/versionName \"$NEW_VERSION_NAME\"/" app/build.gradle
          
          echo "✅ Version updated: Code=$NEW_VERSION, Name=$NEW_VERSION_NAME"

      - name: Build Android AAB
        run: |
          cd android
          ./gradlew bundleRelease \
            -PMYAPP_RELEASE_STORE_FILE=keystore.jks \
            -PMYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTORE_KEY_ALIAS }} \
            -PMYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_STORE_PASSWORD }} \
            -PMYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Install Fastlane
        run: sudo gem install fastlane -NV 

      - name: Deploy to Google Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "⚠️ Error: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret not set"
            exit 1
          fi
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > android/playstore-credentials.json
          cd android
          fastlane playstore || EXIT_CODE=$?
          # Clean up credentials file
          rm -f android/playstore-credentials.json
          if [ -n "$EXIT_CODE" ]; then
            exit $EXIT_CODE
          fi

      - name: Send Discord notification on failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"content": "🚨 Deployment Failed! Error logs:Fast Lane Service Failed"}' \
                 ${{ secrets.DISCORD_WEBHOOK_URL }} || true
          fi

      - name: Send Slack notification on failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"text": "🚨 Deployment Failed! Error logs:Fast Lane Service Failed"}' \
                 ${{ secrets.SLACK_WEBHOOK }} || true
          fi

      - name: Send Discord notification on success
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"content": "✅ Deployed To Play Store 🎉!"}' \
                 ${{ secrets.DISCORD_WEBHOOK_URL }} || true
          fi

      - name: Send Slack notification on success
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"text": "✅ Deployed To Play Store 🎉!"}' \
                 ${{ secrets.SLACK_WEBHOOK }} || true
          fi

  expo-update-android:
    runs-on: ubuntu-latest
    needs: [lint-and-test, changes]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.native != 'true' &&
      needs.changes.outputs.deps != 'true' &&
      needs.changes.outputs.js == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Expo (EAS Update)
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish Expo update (Android)
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          set -e
          # Use 'production' channel to match AndroidManifest.xml configuration
          CHANNEL="production"
          MESSAGE="GitHub Actions update: ${GITHUB_SHA}"
          if [ -n "$EAS_PROJECT_ID" ]; then
            npx eas-cli@latest update --non-interactive --channel "$CHANNEL" --platform android --message "$MESSAGE" --project-id "$EAS_PROJECT_ID"
          else
            npx eas-cli@latest update --non-interactive --channel "$CHANNEL" --platform android --message "$MESSAGE"
          fi

      - name: Send Slack notification (Expo update)
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            STATUS="${{ job.status }}"
            BRANCH="${GITHUB_REF_NAME}"
            SHA="${GITHUB_SHA}"
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"text\":\"📦 Expo Update (Android) on ${BRANCH}: ${STATUS} (${SHA})\"}" \
                 ${{ secrets.SLACK_WEBHOOK }} || true
          fi

