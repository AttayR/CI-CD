name: Staging CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Choose deployment type'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - expo
          - native
      version_code:
        description: 'VersionCode for native deploy (e.g. 8)'
        required: false
        default: ''
      version_name:
        description: 'VersionName for native deploy (e.g. 1.0.7)'
        required: false
        default: ''


jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      deps: ${{ steps.filter.outputs.deps }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Make the comparison explicit so pushes only consider what changed
          # between the previous commit and this commit.
          base: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'push' && github.event.before) || github.sha }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          filters: |
            native:
              - 'android/**'
              - 'ios/**'
            deps:
              - 'package.json'
              - 'package-lock.json'
              - 'yarn.lock'
              - 'pnpm-lock.yaml'
              - 'app.json'
              - 'babel.config.js'
              - 'metro.config.js'
              - 'tsconfig.json'
            js:
              - 'src/**'
              - 'assets/**'
              - 'index.js'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'

      - name: Debug detected changes
        run: |
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "before=${{ github.event.before }}"
          echo ""
          echo "paths-filter outputs:"
          echo "  native=${{ steps.filter.outputs.native }}"
          echo "  deps=${{ steps.filter.outputs.deps }}"
          echo "  js=${{ steps.filter.outputs.js }}"
          echo ""
          echo "Changed files (best-effort):"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "${GITHUB_SHA}" || true
          else
            git diff --name-only HEAD~1 HEAD || true
          fi

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'    

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js dependencies
        run: |
          echo "Installing dependencies..."
          npm install --legacy-peer-deps
          echo "✅ Dependencies installed successfully"

      - name: Verify setup
        run: |
          echo "✅ Setup verification complete"
          node --version
          npm --version
          echo "✅ All checks passed"


      - name: Send Slack notification on failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"text": "🚨 Staging CI/CD Build Failed! Setup verification failed!"}' \
                 ${{ secrets.SLACK_WEBHOOK }} || true
          fi

      - name: Send Slack notification on success
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{"text": "✅ Staging Setup verification passed"}' \
                 ${{ secrets.SLACK_WEBHOOK }} || true
          fi

  expo-update-android:
    runs-on: ubuntu-latest
    needs: [lint-and-test, changes]
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.deploy_type == 'expo'
      ) ||
      (
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/CLI-TO-EXPO') &&
        needs.changes.outputs.native != 'true' &&
        needs.changes.outputs.deps != 'true' &&
        needs.changes.outputs.js == 'true'
      )


    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Expo (EAS Update)
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish Expo update (Android)
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          set -e
          # Use 'production' channel to match AndroidManifest.xml configuration
          CHANNEL="production"
          MESSAGE="GitHub Actions update: ${GITHUB_SHA}"
          if [ -n "$EAS_PROJECT_ID" ]; then
            npx eas-cli@latest update --non-interactive --channel "$CHANNEL" --platform android --message "$MESSAGE" --project-id "$EAS_PROJECT_ID"
          else
            npx eas-cli@latest update --non-interactive --channel "$CHANNEL" --platform android --message "$MESSAGE"
          fi

      - name: Send Slack notification (Expo update)
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            STATUS="${{ job.status }}"
            BRANCH="${GITHUB_REF_NAME}"
            SHA="${GITHUB_SHA}"
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"text\":\"📦 Expo Update (Android) on ${BRANCH}: ${STATUS} (${SHA})\"}" \
                 ${{ secrets.SLACK_WEBHOOK }} || true
          fi

  build-native-android:
    runs-on: ubuntu-latest
    needs: [lint-and-test, changes]
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.deploy_type == 'native'
      ) ||
      (
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/CLI-TO-EXPO') &&
        (needs.changes.outputs.native == 'true' || needs.changes.outputs.deps == 'true')
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node.js dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode and restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "✅ Keystore restored successfully"
          else
            echo "⚠️ Warning: KEYSTORE_BASE64 secret not set"
            exit 1
          fi

      - name: Increment version (for Play Store upload)
        env:
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code || '' }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name || '' }}
        run: |
          cd android
          CURRENT_VERSION=$(awk '/versionCode/ {print $2}' app/build.gradle | head -1)
          CURRENT_VERSION_NAME=$(awk -F'"' '/versionName/ {print $2}' app/build.gradle | head -1)

          # -------- versionCode --------
          if [ -n "$INPUT_VERSION_CODE" ]; then
            # Use user-provided versionCode from workflow_dispatch
            NEW_VERSION="$INPUT_VERSION_CODE"
            echo "📦 Using manual versionCode from input: $NEW_VERSION"
          else
            # Auto-increment when no manual versionCode is provided
            NEW_VERSION=$((CURRENT_VERSION + 1))
            echo "📦 Auto-incrementing versionCode from $CURRENT_VERSION to $NEW_VERSION"
          fi

          sed -i "s/versionCode $CURRENT_VERSION/versionCode $NEW_VERSION/" app/build.gradle

          # -------- versionName --------
          if [ -n "$INPUT_VERSION_NAME" ]; then
            NEW_VERSION_NAME="$INPUT_VERSION_NAME"
            echo "📦 Using manual versionName from input: $NEW_VERSION_NAME"
          else
            # Fallback: simple PATCH bump
            IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION_NAME"
            MAJOR=${VERSION_PARTS[0]:-1}
            MINOR=${VERSION_PARTS[1]:-0}
            PATCH=${VERSION_PARTS[2]:-0}
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION_NAME="$MAJOR.$MINOR.$NEW_PATCH"
            echo "📦 Auto-bumping versionName patch: $CURRENT_VERSION_NAME -> $NEW_VERSION_NAME"
          fi

          sed -i "s/versionName \"$CURRENT_VERSION_NAME\"/versionName \"$NEW_VERSION_NAME\"/" app/build.gradle

      - name: Build Android AAB (Release - Play Store)
        run: |
          cd android
          ./gradlew bundleRelease \
            -PMYAPP_RELEASE_STORE_FILE=keystore.jks \
            -PMYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTORE_KEY_ALIAS }} \
            -PMYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_STORE_PASSWORD }} \
            -PMYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.ref_name }}-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      - name: Upload to Google Play (Internal testing - draft)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -e
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "⚠️ Error: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret not set"
            exit 1
          fi
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > android/playstore-credentials.json
          (cd android && fastlane staging)
          rm -f android/playstore-credentials.json

      - name: Send Slack notification (Native Android build)
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            STATUS="${{ job.status }}"
            BRANCH="${GITHUB_REF_NAME}"
            SHA="${GITHUB_SHA}"
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"text\":\"🤖 Native Android AAB uploaded to Play Internal (draft) on ${BRANCH}: ${STATUS} (${SHA})\\n${RUN_URL}\"}" \
                 ${{ secrets.SLACK_WEBHOOK }} || true
          fi
     
